name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: bash -n y shellcheck
        shell: bash
        run: |
          set -euo pipefail
          shellcheck --version
          # *.sh versionados + ficheros sin extensión con shebang bash
          scripts=()
          while IFS= read -r f; do
            case "$f" in
              *.sh) scripts+=("$f") ;;
              */*.*|*.*) ;;
              *) [ -f "$f" ] && head -n1 "$f" | grep -Eq '^#!.*[/ ]bash' && scripts+=("$f") ;;
            esac
          done < <(git ls-files)
          if [ "${#scripts[@]}" -eq 0 ]; then echo "Sin scripts"; exit 0; fi
          printf '%s\n' "${scripts[@]}"
          rc=0
          for f in "${scripts[@]}"; do bash -n "$f" || rc=1; done
          shellcheck -S warning "${scripts[@]}" || rc=1
          exit "$rc"
